<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAAD LIST</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #e8edf3;
    --border: #d1dbe8;
    --accent: #1a56db;
    --accent2: #7e22ce;
    --text: #0f172a;
    --text-muted: #64748b;
    --c3: #059669;
    --c5: #1d4ed8;
    --c8: #b45309;
    --pc3: #be185d;
    --pc5: #6d28d9;
    --pc8: #b91c1c;
    --c10: #0f766e;
    --tag-bg: #e2e8f0;
    --header-bg: #0f172a;
    --header-text: #f8fafc;
    --filter-bg: #ffffff;
  }
  /* ANIMATIONS */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Cards */
  .product-card {
    animation: fadeInUp 0.25s ease both;
  }

  /* Section blocks */
  .section-block {
    animation: fadeIn 0.3s ease both;
  }

  /* Chips */
  .chip {
    transition: all 0.2s ease;
  }
  .chip:active {
    transform: scale(0.95);
  }

  /* Modal */
  .modal {
    animation: scaleIn 0.2s ease both;
  }
  .modal-overlay.open {
    animation: fadeIn 0.15s ease both;
  }

  /* Stagger على الـ cards */
  .product-card:nth-child(1)  { animation-delay: 0.03s; }
  .product-card:nth-child(2)  { animation-delay: 0.06s; }
  .product-card:nth-child(3)  { animation-delay: 0.09s; }
  .product-card:nth-child(4)  { animation-delay: 0.12s; }
  .product-card:nth-child(5)  { animation-delay: 0.15s; }
  .product-card:nth-child(6)  { animation-delay: 0.18s; }
  .product-card:nth-child(7)  { animation-delay: 0.21s; }
  .product-card:nth-child(8)  { animation-delay: 0.24s; }

  /* Chips أنيميشن لما بتظهر */
  .chip {
    animation: fadeInUp 0.2s ease both;
  }

  /* Badge في الـ section header */
  .section-badge {
    transition: transform 0.2s ease;
  }
  .section-header:hover .section-badge {
    transform: scale(1.05);
  }

  /* c10 */
  .chip.c10.active { background: var(--c10); border-color: var(--c10); color: #fff; }
  .product-card.c10 { border-right-color: var(--c10); }
  .badge-c10 { background: #ccfbf1; color: #134e4a; }
  {
    .chip.c10.active { background: var(--c10); border-color: var(--c10); color: #fff; }
    .product-card.c10 { border-right-color: var(--c10); }
    .badge-c10 { background: #ccfbf1; color: #134e4a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Cairo', sans-serif; 
    background: var(--bg); 
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--header-bg);
    padding: 16px 30px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: #ffffff;
    letter-spacing: 3px;
    white-space: nowrap;
    line-height: 1;
  }
  .logo span { color: #60a5fa; }
  .search-box {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 9px 40px 9px 16px;
    color: #f1f5f9;
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input::placeholder { color: #64748b; }
  .search-box input:focus { border-color: #60a5fa; }
  .search-box::after {
    content: '🔍';
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 0.85rem;
  }
  .stats {
    font-size: 0.78rem;
    color: #94a3b8;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
  }
  .stats span { color: #60a5fa; font-weight: 700; }

  /* FILTERS */
  .filters {
    background: var(--filter-bg);
    border-bottom: 2px solid var(--border);
    padding: 12px 30px;
    position: sticky;
    top: 65px;
    z-index: 99;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .filters-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'JetBrains Mono', monospace;
  }
  .filter-chips {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 4px 12px;
    border-radius: 5px;
    font-size: 0.72rem;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    transition: all 0.15s;
    white-space: nowrap;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.c3.active { background: var(--c3); border-color: var(--c3); color: #fff; }
  .chip.c5.active { background: var(--c5); border-color: var(--c5); color: #fff; }
  .chip.c8.active { background: var(--c8); border-color: var(--c8); color: #fff; }
  .chip.pc3.active { background: var(--pc3); border-color: var(--pc3); color: #fff; }
  .chip.pc5.active { background: var(--pc5); border-color: var(--pc5); color: #fff; }
  .chip.pc8.active { background: var(--pc8); border-color: var(--pc8); color: #fff; }
  .divider-v { width: 1px; height: 24px; background: var(--border); }

  /* VIT TYPE FILTER */
  .vit-filter-bar {
    background: #fefce8;
    border-bottom: 2px solid #fde68a;
    padding: 10px 30px;
    position: sticky;
    top: 117px;
    z-index: 98;
    display: none;
  }
  .vit-filter-bar.show { display: block; }
  .vit-filter-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .vit-label {
    font-size: 0.7rem;
    color: #92400e;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }
  .vit-chip {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 0.7rem;
    cursor: pointer;
    border: 1.5px solid #fcd34d;
    background: #fff;
    color: #92400e;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
  }
  .vit-chip:hover { background: #fef3c7; border-color: #f59e0b; }
  .vit-chip.active { background: #f59e0b; border-color: #f59e0b; color: #fff; }

  /* MAIN */
  .main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 30px;
  }

  /* SECTION HEADERS */
  .section-block { margin-bottom: 40px; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    padding: 12px 16px;
    background: var(--header-bg);
    border-radius: 8px;
  }
  .section-badge {
    padding: 5px 16px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    border: none;
  }
  .badge-c3 { background: #dcfce7; color: #166534; }
  .badge-c5 { background: #dbeafe; color: #1e3a8a; }
  .badge-c8 { background: #fef3c7; color: #78350f; }
  .badge-pc3 { background: #fce7f3; color: #831843; }
  .badge-pc5 { background: #ede9fe; color: #4c1d95; }
  .badge-pc8 { background: #fee2e2; color: #7f1d1d; }
  .section-count {
    font-size: 0.75rem;
    color: #94a3b8;
    font-family: 'JetBrains Mono', monospace;
    margin-right: auto;
  }

  /* CATEGORY BLOCKS */
  .category-block { margin-bottom: 24px; }
  .category-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 8px 0;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
  }
  .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .category-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .category-count {
    font-size: 0.7rem;
    color: #fff;
    background: var(--text-muted);
    padding: 1px 7px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
  }
  .collapse-btn {
    margin-right: auto;
    font-size: 0.65rem;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    transition: transform 0.2s;
    padding: 2px 6px;
  }
  .collapse-btn.collapsed { transform: rotate(180deg); }

  /* VIT SUBCATEGORY */
  .vit-subcat-block { margin-bottom: 16px; }
  .vit-subcat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    padding: 5px 10px;
    background: #fef9c3;
    border-right: 3px solid #f59e0b;
    border-radius: 0 6px 6px 0;
  }
  .vit-subcat-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: #92400e;
    letter-spacing: 1px;
  }
  .vit-subcat-count {
    font-size: 0.65rem;
    color: #92400e;
    background: #fde68a;
    padding: 1px 6px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* PRODUCT GRID */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 8px;
  }
  .product-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    border-right-width: 4px;
  }
  .product-card.c3 { border-right-color: var(--c3); }
  .product-card.c5 { border-right-color: var(--c5); }
  .product-card.c8 { border-right-color: var(--c8); }
  .product-card.pc3 { border-right-color: var(--pc3); }
  .product-card.pc5 { border-right-color: var(--pc5); }
  .product-card.pc8 { border-right-color: var(--pc8); }

  .product-card:hover {
    border-color: var(--accent);
    border-right-color: var(--accent);
    background: #eff6ff;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(26,86,219,0.1);
  }
  .product-name {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 7px;
    font-family: 'JetBrains Mono', monospace;
  }
  .product-meta {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
  }
  .meta-tag {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--tag-bg);
    color: var(--text-muted);
    font-family: 'Cairo', sans-serif;
    border: 1px solid var(--border);
  }
  .meta-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--text-muted);
    background: var(--tag-bg);
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }
  .product-links {
    display: flex;
    gap: 5px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .product-card:hover .product-links { opacity: 1; }
  .link-btn {
    font-size: 0.68rem;
    padding: 3px 9px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: all 0.15s;
  }
  .link-btn.img { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
  .link-btn.img:hover { background: #bfdbfe; }
  .link-btn.page { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }
  .link-btn.page:hover { background: #ddd6fe; }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    background: var(--surface);
    border-radius: 12px;
    border: 2px dashed var(--border);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 16px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    max-width: 560px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal-close {
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .modal-close:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
  .modal-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 12px;
    padding-left: 40px;
    line-height: 1.5;
  }
  .modal-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .modal-desc {
    font-size: 0.85rem;
    color: var(--text);
    line-height: 1.9;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
    direction: rtl;
    text-align: right;
  }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .modal-btn {
    flex: 1;
    min-width: 140px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .modal-btn.img { background: #dbeafe; color: #1e40af; border: 1.5px solid #93c5fd; }
  .modal-btn.img:hover { background: #bfdbfe; }
  .modal-btn.page { background: #ede9fe; color: #5b21b6; border: 1.5px solid #c4b5fd; }
  .modal-btn.page:hover { background: #ddd6fe; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  @media (max-width: 600px) {
    .header, .filters { padding: 10px 14px; }
    .filters { top: 58px; }
    .vit-filter-bar { top: 106px; }
    .main { padding: 14px; }
    .product-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
    .product-card { padding: 9px 10px; }
    .product-name { font-size: 0.68rem; }
    .logo { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">ZAAD <span>LIST</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج أو كود..." oninput="applyFilters()">
    </div>
    <div class="stats">عرض <span id="countDisplay">0</span> / <span id="totalDisplay">0</span></div>
  </div>
</div>

<div class="filters">
  <div class="filters-inner">
    <div class="filter-group">
      <span class="filter-label">Commission</span>
      <div class="filter-chips" id="commChips"></div>
    </div>
    <div class="divider-v"></div>
    <div class="filter-group">
      <span class="filter-label">القسم</span>
      <div class="filter-chips" id="sheetChips"></div>
    </div>
  </div>
</div>

<div class="vit-filter-bar" id="vitFilterBar">
  <div class="vit-filter-inner">
    <span class="vit-label">🌿 نوع الفيتامين</span>
    <div id="vitTypeChips"></div>
  </div>
</div>

<div class="main" id="mainContent"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnBg(event)">
  <div class="modal" id="modalBox">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-name" id="modalName"></div>
    <div class="modal-badges" id="modalBadges"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>

function getVitType(name) {
  const n = name.toLowerCase();
  for (const vt of VIT_TYPES) {
    if (vt.key === 'other') continue;
    if (vt.terms.some(t => n.includes(t))) return vt.key;
  }
  return 'other';
}

let activeComm = null;
let activeSheet = null;
let activeVitType = null;

function buildFilters() {
  // Commission chips
  const commChips = document.getElementById('commChips');
  SECTION_ORDER.forEach(sec => {
    const info = SECTION_MAP[sec];
    if (!info) return;
    const chip = document.createElement('div');
    chip.className = 'chip ' + info.cls;
    chip.textContent = info.label;
    chip.dataset.val = sec;
    chip.onclick = () => toggleComm(sec, chip);
    commChips.appendChild(chip);
  });

  // Sheet chips
  const sheetChips = document.getElementById('sheetChips');
  const allChip = document.createElement('div');
  allChip.className = 'chip active';
  allChip.textContent = 'الكل';
  allChip.id = 'sheetAll';
  allChip.onclick = () => { activeSheet = null; activeVitType = null; updateSheetChips(null); toggleVitBar(false); applyFilters(); };
  sheetChips.appendChild(allChip);

  const sheets = [...new Set(ALL_DATA.map(d => d.sheet))];
  const sheetLabels = {};
  ALL_DATA.forEach(d => sheetLabels[d.sheet] = d.sheetLabel);
  sheets.forEach(sh => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = sheetLabels[sh] || sh;
    chip.dataset.val = sh;
    chip.onclick = () => {
      activeSheet = sh;
      activeVitType = null;
      updateSheetChips(sh);
      toggleVitBar(sh === 'vit');
      applyFilters();
    };
    sheetChips.appendChild(chip);
  });

  // Vit type chips
  const vitChipsEl = document.getElementById('vitTypeChips');
  vitChipsEl.style.display = 'flex';
  vitChipsEl.style.gap = '5px';
  vitChipsEl.style.flexWrap = 'wrap';
  const allVit = document.createElement('div');
  allVit.className = 'vit-chip active';
  allVit.textContent = 'الكل';
  allVit.id = 'vitAll';
  allVit.onclick = () => { activeVitType = null; updateVitChips(null); applyFilters(); };
  vitChipsEl.appendChild(allVit);

  VIT_TYPES.forEach(vt => {
    const chip = document.createElement('div');
    chip.className = 'vit-chip';
    chip.textContent = vt.label;
    chip.dataset.key = vt.key;
    chip.onclick = () => { activeVitType = vt.key; updateVitChips(vt.key); applyFilters(); };
    vitChipsEl.appendChild(chip);
  });
}

function toggleVitBar(show) {
  document.getElementById('vitFilterBar').classList.toggle('show', show);
}

function updateVitChips(val) {
  document.querySelectorAll('#vitTypeChips .vit-chip').forEach(c => {
    c.classList.remove('active');
    if (val === null && c.id === 'vitAll') c.classList.add('active');
    else if (c.dataset.key === val) c.classList.add('active');
  });
}

function updateSheetChips(val) {
  document.querySelectorAll('#sheetChips .chip').forEach(c => {
    c.classList.remove('active');
    if (val === null && c.id === 'sheetAll') c.classList.add('active');
    else if (c.dataset.val === val) c.classList.add('active');
  });
}

function toggleComm(sec, chip) {
  if (activeComm === sec) {
    activeComm = null;
    chip.classList.remove('active');
  } else {
    activeComm = sec;
    document.querySelectorAll('#commChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  }
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let filtered = ALL_DATA;
  if (activeComm) filtered = filtered.filter(d => d.section === activeComm);
  if (activeSheet) filtered = filtered.filter(d => d.sheet === activeSheet);
  if (activeVitType && activeSheet === 'vit') filtered = filtered.filter(d => getVitType(d.name) === activeVitType);
  if (q) filtered = filtered.filter(d => d.name.toLowerCase().includes(q) || d.code.includes(q));
  renderContent(filtered);
}

function renderContent(items) {
  document.getElementById('countDisplay').textContent = items.length.toLocaleString();
  document.getElementById('totalDisplay').textContent = ALL_DATA.length.toLocaleString();
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  if (items.length === 0) {
    main.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div>لا توجد منتجات مطابقة</div></div>';
    return;
  }

  // Group by section, then category, then (if vit) by vit type
  const bySec = {};
  items.forEach(d => {
    const sec = d.section || 'غير محدد';
    if (!bySec[sec]) bySec[sec] = {};
    const cat = (d.category && d.category !== 'nan' && d.category !== '') ? d.category : (d.sheetLabel || d.sheet);
    if (!bySec[sec][cat]) bySec[sec][cat] = [];
    bySec[sec][cat].push(d);
  });

  const secOrder = SECTION_ORDER.filter(s => bySec[s]);
  const rest = Object.keys(bySec).filter(s => !SECTION_ORDER.includes(s));
  [...secOrder, ...rest].forEach(sec => {
    const info = SECTION_MAP[sec] || {label: sec, cls: 'c5'};
    const cats = bySec[sec];
    const totalInSec = Object.values(cats).flat().length;

    const secBlock = document.createElement('div');
    secBlock.className = 'section-block';

    const secHeader = document.createElement('div');
    secHeader.className = 'section-header';
    secHeader.innerHTML = `<div class="section-badge badge-${info.cls}">${info.label}</div><div class="section-count">${totalInSec.toLocaleString()} منتج</div>`;
    secBlock.appendChild(secHeader);

    Object.entries(cats).sort((a,b) => a[0].localeCompare(b[0])).forEach(([cat, products]) => {
      const catBlock = document.createElement('div');
      catBlock.className = 'category-block';

      const catId = 'cat_' + Math.random().toString(36).slice(2);
      const catHeader = document.createElement('div');
      catHeader.className = 'category-header';
      catHeader.innerHTML = `<div class="cat-dot"></div><div class="category-title">${cat}</div><div class="category-count">${products.length}</div><button class="collapse-btn" onclick="toggleCat('${catId}',this)">▲</button>`;
      catBlock.appendChild(catHeader);

      const catBody = document.createElement('div');
      catBody.id = catId;

      // If vit sheet and NOT filtering by vit type, group by vit type inside
      const isVitSheet = products.some(p => p.sheet === 'vit');
      if (isVitSheet && !activeVitType) {
        const byVitType = {};
        products.forEach(p => {
          const vk = getVitType(p.name);
          if (!byVitType[vk]) byVitType[vk] = [];
          byVitType[vk].push(p);
        });
        // Render each vit subtype
        VIT_TYPES.forEach(vt => {
          const group = byVitType[vt.key];
          if (!group || group.length === 0) return;
          const subBlock = document.createElement('div');
          subBlock.className = 'vit-subcat-block';
          subBlock.innerHTML = `<div class="vit-subcat-header"><span class="vit-subcat-title">${vt.label}</span><span class="vit-subcat-count">${group.length}</span></div>`;
          const grid = buildGrid(group, info);
          subBlock.appendChild(grid);
          catBody.appendChild(subBlock);
        });
      } else {
        const grid = buildGrid(products, info);
        catBody.appendChild(grid);
      }

      catBlock.appendChild(catBody);
      secBlock.appendChild(catBlock);
    });

    main.appendChild(secBlock);
  });
}

function buildGrid(products, info) {
  const grid = document.createElement('div');
  grid.className = 'product-grid';
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card ' + info.cls;
    const imgUrl = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(p.name + ' product');
    const pageUrl = 'https://www.google.com/search?q=' + encodeURIComponent(p.name + ' pharmacy');
    card.innerHTML = `
      <div class="product-name">${p.name}</div>
      <div class="product-meta">
        ${p.code && p.code !== 'nan' ? '<span class="meta-code">#'+p.code+'</span>' : ''}
        <span class="meta-tag">${p.sheetLabel||p.sheet}</span>
      </div>
      <div class="product-links">
        <a href="${imgUrl}" target="_blank" class="link-btn img">🖼️ صورة</a>
        <a href="${pageUrl}" target="_blank" class="link-btn page">🔗 صفحة</a>
      </div>`;
    card.onclick = (e) => { if (e.target.tagName==='A') return; openModal(p, info); };
    grid.appendChild(card);
  });
  return grid;
}

function toggleCat(id, btn) {
  const el = document.getElementById(id);
  if (el.style.display === 'none') { el.style.display = ''; btn.classList.remove('collapsed'); }
  else { el.style.display = 'none'; btn.classList.add('collapsed'); }
}

function openModal(p, info) {
  const imgUrl = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(p.name + ' product');
  const pageUrl = 'https://www.google.com/search?q=' + encodeURIComponent(p.name + ' pharmacy product');
  document.getElementById('modalName').textContent = p.name;
  document.getElementById('modalBadges').innerHTML = `
    <span class="section-badge badge-${info.cls}" style="font-size:0.72rem;padding:3px 10px">${info.label}</span>
    ${p.category && p.category !== 'nan' ? '<span class="meta-tag">'+p.category+'</span>' : ''}
    <span class="meta-tag">${p.sheetLabel||p.sheet}</span>
    ${p.code && p.code !== 'nan' ? '<span class="meta-code">#'+p.code+'</span>' : ''}
  `;
  document.getElementById('modalDesc').textContent = (p.desc && p.desc !== 'nan' && p.desc) ? p.desc : 'لا يوجد وصف متاح';
  document.getElementById('modalActions').innerHTML = `
    <a href="${imgUrl}" target="_blank" class="modal-btn img">🖼️ بحث عن صورة المنتج</a>
    <a href="${pageUrl}" target="_blank" class="modal-btn page">🔗 صفحة المنتج</a>
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOnBg(e) { if (e.target===document.getElementById('modalOverlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

buildFilters();
applyFilters();
</script>
</body>
</html>
